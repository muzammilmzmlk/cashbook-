<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>CashBook v24</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f3f4f6;--text:#111827;--mutedText:#6b7280;--card:#fff;--soft:#f9fafb;--soft2:#e5e7eb;--border:#e5e7eb;--input:#fff;--header:#111827;--footer:#fff;--blue:#2563eb;--modal:#fff}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:background .2s,color .2s}
body.dark{--bg:#0f172a;--text:#f8fafc;--mutedText:#94a3b8;--card:#111827;--soft:#1e293b;--soft2:#334155;--border:#334155;--input:#0f172a;--header:#020617;--footer:#111827;--modal:#111827;--blue:#60a5fa}
body.dark header{background:var(--header)}
body.dark .card{box-shadow:0 2px 12px rgba(0,0,0,.25)}
body.dark input,body.dark select{color:var(--text);border-color:var(--border)}
body.dark .muted{background:#334155;color:#f8fafc}
body.dark .stat{background:var(--soft)}
body.dark footer,body.dark .bottom-nav{background:var(--footer);border-color:var(--border)}
body.dark .accountMenu,body.dark .categoryMenu,body.dark .accountMenu button,body.dark .categoryMenu button{background:var(--card);color:var(--text);border-color:var(--border)}
body.dark .accountMenu button:hover,body.dark .categoryMenu button:hover{background:#1e293b}
body.dark .modal{background:var(--modal);color:var(--text)}
body.dark .themeOption{background:#1e293b;border-color:#334155;color:#f8fafc}
body.dark .themeOption.active{background:#172554;border-color:#60a5fa}
body.dark .themePreview.light{background:#fff;color:#111827}
body.dark .themePreview.dark{background:#0f172a;color:#f8fafc}
body{min-height:100vh}
header{background:#111827;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:24px}.sub{font-size:12px;opacity:.72;margin-top:3px}
main{max-width:780px;margin:auto;padding:12px 12px calc(92px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:16px;padding:15px;margin-bottom:11px;box-shadow:0 2px 9px rgba(0,0,0,.06)}
.label,.small{font-size:12px;color:var(--mutedText)}.balance{font-size:30px;font-weight:800;margin-top:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--soft);padding:12px;border-radius:12px}.value{font-size:18px;font-weight:750;margin-top:3px}
button,input,select{font:inherit}button{border:0;border-radius:11px;padding:11px 13px;font-weight:650;cursor:pointer}
.primary{background:#111827;color:#fff}.muted{background:#e5e7eb;color:#111827}.inc{background:#dcfce7}.exp{background:#fee2e2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form{display:grid;gap:10px}.field label{display:block;font-size:12px;color:#6b7280;margin:0 0 5px 2px}
input,select{width:100%;height:48px;padding:10px 12px;border:1px solid #cfd4dc;border-radius:11px;background:var(--input);color:var(--text)}
input:focus,select:focus{outline:2px solid #94a3b8;outline-offset:1px}
.tabs{display:flex;gap:7px;overflow:auto;margin:9px 0}.tabs button{white-space:nowrap}.tabs button.activeReport{background:#111827;color:#fff;box-shadow:0 0 0 2px #c7d2fe}.customRange{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end;margin:10px 0;padding:8px;box-sizing:border-box;overflow:hidden;border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc}.customRange .field{min-width:0;width:100%;overflow:hidden}.customRange label{display:block;margin:0 0 5px 2px;font-size:13px;font-weight:600}.customRange input{display:block;width:100%;min-width:0;max-width:100%;height:42px!important;min-height:42px!important;max-height:42px!important;box-sizing:border-box;padding:8px 9px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;font-size:15px;line-height:24px;-webkit-appearance:none;appearance:none}.customRange button{grid-column:1/-1;width:100%;height:44px;min-width:0}@media(max-width:480px){.customRange{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;padding:8px}.customRange input{font-size:15px;padding:8px 7px}}
.hidden{display:none!important}.tx,.cat{padding:11px 0;border-bottom:1px solid #eee}.tx:last-child,.cat:last-child{border-bottom:0}
.txTitle{font-size:17px;font-weight:800;line-height:21px}.txMeta{font-size:14px;color:#6b7280;font-weight:600;margin-top:3px;line-height:19px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.amt{font-weight:750}.red{color:#dc2626}.green{color:#16a34a}.danger{color:#b91c1c}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--footer);border-top:1px solid var(--border);padding:9px max(9px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));z-index:6}
footer button{width:min(750px,95%)}
.modalBackdrop{position:fixed;pointer-events:auto!important;inset:0;background:rgba(0,0,0,.48);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{position:relative;z-index:31;background:var(--modal);width:min(100%,560px);max-height:calc(100dvh - 32px);overflow:auto;border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modalHeader{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.modalTitle{font-size:22px;font-weight:800}.close{position:relative;z-index:1000;width:48px;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;height:48px;padding:0;border-radius:14px;background:#e9edf2;font-size:30px;line-height:48px;color:#0b82e8}
.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;z-index:50;font-size:14px}
.detailList{max-height:55vh;overflow:auto;margin-top:10px}
@media(max-width:480px){.modalBackdrop{align-items:flex-end;padding:0}.modal{width:100%;max-height:92dvh;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.modalTitle{font-size:21px}}

/* Clean three-tab layout */
main{padding-bottom:92px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--footer);border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.bottom-nav button{background:transparent;border-radius:12px;padding:12px 6px;color:#6b7280}
.bottom-nav button.active{background:#eef2ff;color:#2563eb;font-weight:800}
.sectionTitle{font-size:20px;font-weight:800;margin:2px 0 12px}
.settingsList{display:grid;gap:10px}
.settingsList button{width:100%;text-align:left;padding:15px}
.settingsList .danger{border:1px solid #fecaca;background:#fff1f2}
</style>

<style id="theme-settings-style">
.settingsGroup{margin-bottom:12px}
.settingsGroup:last-child{margin-bottom:0}
.groupHeader{font-size:20px;font-weight:800;margin:0 0 10px}
.folderButton{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:15px 16px;background:var(--soft2);color:var(--text)}
.folderButton .left{display:flex;align-items:center;gap:10px}
.folderIcon{font-size:22px}
.settingsSub{display:grid;gap:10px;margin-top:10px}
.settingsSub button{width:100%;text-align:left;padding:14px 16px;background:var(--soft);color:var(--text)}
.themeModalOptions{display:grid;gap:10px}
.themeOption{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 15px;border:1px solid var(--border);border-radius:13px;background:var(--soft);color:var(--text);text-align:left}
.themeOption.active{outline:2px solid #93c5fd;outline-offset:1px}
.themeOptionMain{display:flex;align-items:center;gap:12px}
.themePreview{width:34px;height:34px;border-radius:9px;border:1px solid #cbd5e1;display:grid;place-items:center;font-size:16px}
.themePreview.light{background:#fff;color:#111827}.themePreview.dark{background:#0f172a;color:#fff}
.themeCheck{font-size:20px;color:var(--blue);font-weight:800}
</style>

<style id="date-size-fix">
#date{height:48px!important;min-height:48px!important;max-height:48px!important;
  -webkit-appearance:none;appearance:none;font-size:16px;line-height:24px;
  padding:10px 12px!important}
</style>


<style id="account-menu-style">
.accountRow{position:relative;padding:10px 0;border-bottom:1px solid #eee}
.accountMain{display:flex;justify-content:space-between;align-items:center;gap:10px}
.accountMenuWrap{position:relative;flex:0 0 auto}
.accountDots{width:42px;height:42px;padding:0;border-radius:12px;background:#e5e7eb;font-size:22px;line-height:42px}
.accountMenu{position:absolute;right:0;top:46px;min-width:145px;background:#fff;border:1px solid #e5e7eb;
 border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:5px;z-index:20}
.accountMenu.hidden{display:none!important}
.accountMenu button{display:block;width:100%;text-align:left;background:#fff;padding:11px 12px;border-radius:9px}
.accountMenu button:hover{background:#f3f4f6}
.accountMenu .deleteAccount{color:#b91c1c}
</style>

<style id="category-row-style">
.categoryRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer}
.categoryRow:last-child{border-bottom:0}
.categoryRow .categoryMenuWrap{position:relative;flex:0 0 auto}
.categoryDots{width:42px;height:42px;padding:0;border:0;border-radius:12px;background:#e5e7eb;font-size:22px;line-height:42px}
.categoryMenu{position:absolute;right:0;top:46px;min-width:130px;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.16);padding:5px;z-index:100}
.categoryMenu.hidden{display:none!important}
.categoryMenu button{display:block;width:100%;text-align:left;background:#fff;border:0;padding:11px 12px;border-radius:8px}
</style></head>
<body>
<header><h1>💰 CashBook</h1><div class="sub">Income • Expense • Cash • Bank</div></header>
<main>
  <section id="entriesTab" class="tab-panel active">
    <div class="card">
      <div class="label">Total Balance</div><div id="totalBalance" class="balance">AED 0.00</div>
      <div class="grid" style="margin-top:11px">
        <div class="stat"><div class="label">Total Income</div><div id="totalIncome" class="value green">AED 0.00</div></div>
        <div class="stat"><div class="label">Total Expense</div><div id="totalExpense" class="value red">AED 0.00</div></div>
      </div>
    </div>
    <div class="card">
      <div class="actions"><button class="inc" id="incomeBtn">＋ Income</button><button class="exp" id="expenseBtn">− Expense</button></div>
      <button class="muted" style="width:100%;margin-top:9px" id="transferBtn">⇄ Transfer between accounts</button>
    </div>
    <div class="card">
      <div class="row"><b>Transactions</b><button class="muted" id="addTransactionBtn">＋ Add Entry</button></div>
      <div id="transactions"></div>
    </div>
  </section>

  <section id="reportTab" class="tab-panel">
    <div class="card">
      <div class="sectionTitle">Report</div>
      <div class="tabs">
        <button class="muted reportBtn" data-period="all">All Time</button>
        <button class="muted reportBtn" data-period="month">This Month</button>
        <button class="muted reportBtn" data-period="lastMonth">Last Month</button>
        <button class="muted reportBtn" data-period="year">This Year</button>
        <button class="muted reportBtn" data-period="custom">Custom Date</button>
      </div>
      <div id="reportCustomRange" class="customRange hidden">
        <div class="field"><label>From</label><input id="reportCustomStart" type="date"></div>
        <div class="field"><label>To</label><input id="reportCustomEnd" type="date"></div>
        <button class="primary" id="reportApplyCustomBtn" type="button">Apply</button>
      </div>
      <div class="grid" style="margin-top:11px">
        <div class="stat"><div class="label">Income</div><div id="reportIncome" class="value green">AED 0.00</div></div>
        <div class="stat"><div class="label">Expense</div><div id="reportExpense" class="value red">AED 0.00</div></div>
      </div>
      <div class="stat" style="margin-top:10px"><div class="label">Net Savings</div><div id="reportSavings" class="value">AED 0.00</div></div>
    </div>
    <div class="card">
      <div class="sectionTitle">Category Report</div>
      <div id="reportCategories"></div>
    </div>
  </section>

  <section id="accountsTab" class="tab-panel">
    <div class="card">
      <div class="row"><div class="sectionTitle">Accounts</div><button class="muted" id="addAccountBtn">＋ Add account</button></div>
      <div id="accounts"></div>
    </div>
    <div class="card">
      <div class="row"><div class="sectionTitle">Categories</div><button class="muted" id="addCategoryBtn">＋ Category</button></div>
      <div class="tabs">
        <button class="muted reportBtn" data-period="all">All Time</button>
        <button class="muted reportBtn" data-period="month">This Month</button>
        <button class="muted reportBtn" data-period="lastMonth">Last Month</button>
        <button class="muted reportBtn" data-period="year">This Year</button>
        <button class="muted reportBtn" data-period="custom">Custom Date</button>
      </div>
      <div id="customRange" class="customRange hidden">
        <div class="field"><label>From</label><input id="customStart" type="date"></div>
        <div class="field"><label>To</label><input id="customEnd" type="date"></div>
        <button class="primary" id="applyCustomBtn" type="button">Apply</button>
      </div>
      <div id="categories"></div>
    </div>
  </section>

  <section id="settingsTab" class="tab-panel">
    <div class="card">
      <div class="sectionTitle">Settings</div>

      <div class="settingsGroup">
        <div class="groupHeader">📂 Data</div>
        <div class="settingsSub">
          <button class="muted" id="exportBtn">⇩ Export CSV</button>
          <button class="muted" id="backupBtn">☁ Backup</button>
          <button class="muted" id="restoreBtn">↥ Restore</button>
          <input id="restoreInput" type="file" accept=".json" class="hidden">
          <button class="danger" id="wipeBtn">🗑 Delete all entries</button>
        </div>
      </div>

      <div class="settingsGroup">
        <div class="groupHeader">⚙️ App Settings</div>
        <div class="settingsSub">
          <button class="folderButton" id="themesBtn" type="button"><span class="left"><span class="folderIcon">🎨</span><span>Themes</span></span><span>›</span></button>
        </div>
      </div>
    </div>
  </section>
</main>
<nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
  <button type="button" class="active" data-tab="entriesTab">Entries</button>
  <button type="button" data-tab="reportTab">Report</button>
  <button type="button" data-tab="accountsTab">Accounts</button>
  <button type="button" data-tab="settingsTab">Settings</button>
</nav>
<div id="txModal" class="modalBackdrop hidden" role="dialog" aria-modal="true">
<div class="modal">
<div class="modalHeader"><div id="modalTitle" class="modalTitle">Add Expense</div><button type="button" class="close" id="closeModal" aria-label="Close">×</button></div>
<div class="form">
<div class="field"><label for="txType">Transaction Type</label><select id="txType"><option value="expense">Expense</option><option value="income">Income</option><option value="transfer">Transfer Between Accounts</option></select></div>
<div class="field"><label for="date">Date</label><input id="date" type="date"></div>
<div class="field"><label for="amount">Amount (AED)</label><input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
<div class="field"><label for="account">Account</label><select id="account"></select></div>
<div class="field" id="categoryField"><label for="category">Category</label><select id="category"></select></div>
<div class="field hidden" id="toAccountField"><label for="toAccount">Transfer to</label><select id="toAccount"></select></div>
<div class="field"><label for="description">Description</label><input id="description" type="text" placeholder="e.g. Lunch"></div>
<div class="modalActions"><button class="muted" id="cancelModal">Cancel</button><button class="primary" id="saveBtn">Save</button></div>
</div></div></div>

<div id="detailModal" class="modalBackdrop hidden" role="dialog" aria-modal="true">
<div class="modal">
<div class="modalHeader"><div id="detailTitle" class="modalTitle">Category</div><button type="button" class="close" id="closeDetail" aria-label="Close" onclick="closeAnyModal()">×</button></div>
<div id="detailContent" class="detailList"></div>
</div></div></div>
<div id="themeModal" class="modalBackdrop hidden" role="dialog" aria-modal="true">
<div class="modal">
<div class="modalHeader"><div class="modalTitle">Themes</div><button type="button" class="close" id="closeThemeModal" aria-label="Close">×</button></div>
<div class="themeModalOptions">
<button type="button" class="themeOption" data-theme="light"><span class="themeOptionMain"><span class="themePreview light">☀️</span><span><b>Light Mode</b><div class="small">Use the light theme</div></span></span><span class="themeCheck"></span></button>
<button type="button" class="themeOption" data-theme="dark"><span class="themeOptionMain"><span class="themePreview dark">🌙</span><span><b>Dark Mode</b><div class="small">Use the dark theme</div></span></span><span class="themeCheck"></span></button>
</div>
</div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='cashbook_v3';
const defaultDB={accounts:[{id:'cash',name:'Cash',opening:0},{id:'bank1',name:'Bank 1',opening:0}],categories:['Food','Fuel','Rent','Shopping','Office Expense','Salary','Other'],tx:[]};
let db=loadDB(), mode='expense', editingId=null, currentReport='all', toastTimer=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'AED '+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function loadDB(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');return d&&d.accounts&&d.tx?d:structuredClone(defaultDB)}catch{return structuredClone(defaultDB)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function account(id){return db.accounts.find(a=>a.id===id)}
function accountBalance(a){
 let n=Number(a.opening||0);
 for(const t of db.tx){
   if(t.account===a.id){
     if(t.type==='income')n+=t.amount;
     if(t.type==='expense')n-=t.amount;
     if(t.type==='transfer')n-=t.amount;
   }
   if(t.type==='transfer'&&t.to===a.id)n+=t.amount;
 }
 return n;
}
function totals(){
 let income=0,expense=0,opening=0;
 db.accounts.forEach(a=>opening+=Number(a.opening||0));
 db.tx.forEach(t=>{if(t.type==='income')income+=t.amount;if(t.type==='expense')expense+=t.amount});
 return {income,expense,balance:opening+income-expense};
}
function today(){return new Date().toLocaleDateString('en-CA')}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),1800)}
function render(){
 const t=totals();
 $('totalBalance').textContent=money(t.balance);
 $('totalIncome').textContent=money(t.income);
 $('totalExpense').textContent=money(t.expense);
 $('accounts').innerHTML=db.accounts.map(a=>`<div class="accountRow">
  <div class="accountMain">
   <div><b>🏦 ${esc(a.name)}</b><div class="small">Opening balance: ${money(a.opening)}</div></div>
   <div class="accountMenuWrap">
    <b>${money(accountBalance(a))}</b>
    <button type="button" class="accountDots" aria-label="Account options" onclick="toggleAccountMenu(event,'${esc(a.id)}')">⋮</button>
    <div class="accountMenu hidden" id="accountMenu_${esc(a.id)}">
     <button type="button" onclick="editOpening('${esc(a.id)}')">Opening</button>
     <button type="button" onclick="editAccount('${esc(a.id)}')">Edit</button>
     <button type="button" class="deleteAccount" onclick="deleteAccount('${esc(a.id)}')">Delete</button>
    </div>
   </div>
  </div>
 </div>`).join('');
 renderTransactions(); renderReport(currentReport);
}
function renderTransactions(){
 const arr=[...db.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $('transactions').innerHTML=arr.length?arr.map(t=>{
 const type=t.type==='income'?'Income':t.type==='expense'?'Expense':'Account Transfer';
 const sign=t.type==='income'?'+':t.type==='expense'?'-':'';
 const displayDate=(d)=>{const x=String(d||'').split('-');return x.length===3?`${x[2]}-${x[1]}-${x[0]}`:String(d||'')};
 const meta=t.type==='transfer'
   ? `${esc(displayDate(t.date))} • ${esc(account(t.account)?.name||'')} → ${esc(account(t.to)?.name||'')}`
   : `${esc(displayDate(t.date))} • ${esc(t.category||'')} • ${esc(account(t.account)?.name||'')}`;
 return `<div class="tx"><div class="row"><div style="min-width:0"><div class="txTitle">${esc(t.type==='transfer'?'Account Transfer':(t.desc||type))}</div><div class="txMeta">${meta}</div></div>
 <div style="text-align:right;white-space:nowrap"><span class="amt ${t.type==='income'?'green':t.type==='expense'?'red':''}">${sign}${money(t.amount)}</span><br><button class="muted editTx" data-id="${t.id}">Edit</button> <button class="muted deleteTx" data-id="${t.id}">Delete</button></div></div></div>`;
 }).join(''):'<div class="small" style="padding:12px 0">No transactions yet.</div>';
 document.querySelectorAll('.editTx').forEach(b=>b.onclick=()=>openTx(db.tx.find(t=>t.id===Number(b.dataset.id))));
 document.querySelectorAll('.deleteTx').forEach(b=>b.onclick=()=>deleteTx(Number(b.dataset.id)));
}
function reportRange(period){
 const now=new Date();
 const y=now.getFullYear(),m=now.getMonth();
 if(period==='all')return null;
 if(period==='month')return {start:`${y}-${String(m+1).padStart(2,'0')}-01`,end:`${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`};
 if(period==='lastMonth'){const d=new Date(y,m-1,1);return {start:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`,end:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()).padStart(2,'0')}`};}
 if(period==='year')return {start:`${y}-01-01`,end:`${y}-12-31`};
 if(period==='custom' && customStart && customEnd)return {start:customStart,end:customEnd};
 return null;
}
function filteredExpenses(period){
 const r=reportRange(period);
 let a=db.tx.filter(t=>t.type==='expense');
 if(r)a=a.filter(t=>t.date>=r.start&&t.date<=r.end);
 return a;
}
function updateReportButtons(){
 document.querySelectorAll('.reportBtn').forEach(b=>b.classList.toggle('activeReport',b.dataset.period===currentReport));
 const box=$('customRange');
 if(box)box.classList.toggle('hidden',currentReport!=='custom');
}
function renderReport(period){
 currentReport=period;
 updateReportButtons();
 renderSummaryReport(period);
 const r=reportRange(period);
 const categorized=(r?db.tx.filter(t=>t.type!=='transfer'&&t.date>=r.start&&t.date<=r.end):db.tx.filter(t=>t.type!=='transfer'));
 const all=db.categories.map(name=>{
   const total=categorized.reduce((s,t)=>s+(t.category===name?(Number(t.amount)||0):0),0);
   return `<div class="categoryRow" data-category="${esc(name)}" onclick="showCategory('${esc(name)}','${esc(period)}')">
    <div><span>📁 ${esc(name)}</span><div class="small">${money(total)}</div></div>
    <div class="categoryMenuWrap" onclick="event.stopPropagation()">
      <button type="button" class="categoryDots" onclick="toggleCategoryMenu(event,'${esc(name)}')">⋮</button>
      <div class="categoryMenu hidden" id="categoryMenu_${esc(name)}">
       <button type="button" onclick="editCategoryFromList('${esc(name)}')">Edit</button>
       <button type="button" class="deleteAccount" onclick="deleteCategoryFromList('${esc(name)}')">Delete</button>
      </div>
    </div>
   </div>`;
 }).join('');
 $('categories').innerHTML=all||'<div class="small">No categories yet.</div>';
}
function renderSummaryReport(period){
 const r=reportRange(period);
 let a=r?db.tx.filter(t=>t.date>=r.start&&t.date<=r.end):db.tx.slice();
 const income=a.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount||0),0);
 const expense=a.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount||0),0);
 const savings=income-expense;
 if($('reportIncome'))$('reportIncome').textContent=money(income);
 if($('reportExpense'))$('reportExpense').textContent=money(expense);
 if($('reportSavings'))$('reportSavings').textContent=money(savings);
 if($('reportCategories')){
   const rows=db.categories.map(name=>{const total=a.reduce((sum,t)=>sum+(t.type==='expense'&&t.category===name?Number(t.amount)||0:0),0);return {name,total}}).filter(x=>x.total>0).sort((x,y)=>y.total-x.total);
   $('reportCategories').innerHTML=rows.map(x=>`<div class="categoryRow"><div><b>📁 ${esc(x.name)}</b></div><b class="red">${money(x.total)}</b></div>`).join('')||'<div class="small">No expense data for this period.</div>';
 }
}
function showCategory(cat,period){
 const r=reportRange(period);
 let a=db.tx.filter(t=>t.type!=='transfer'&&t.category===cat);
 if(r)a=a.filter(t=>t.date>=r.start&&t.date<=r.end);
 const total=a.reduce((s,t)=>s+Number(t.amount||0),0);
 $('detailTitle').textContent=cat;$('detailContent').innerHTML=`<div class="card" style="margin:0 0 8px;background:#f9fafb"><div class="label">Total</div><div class="balance" style="font-size:25px">${money(total)}</div><div class="small">${a.length} transaction(s)</div></div>`+
 (a.map(t=>{const sign=t.type==='income'?'+':'-';const cls=t.type==='income'?'green':'red';return `<div class="tx"><div class="row"><div><b>${esc(t.desc||cat)}</b><div class="small">${esc(t.date)} • ${esc(account(t.account)?.name||'')} • ${t.type==='income'?'Income':'Expense'}</div></div><b class="${cls}">${sign}${money(t.amount)}</b></div></div>`}).join('')||'<div class="small">No transactions.</div>');
 $('detailModal').classList.remove('hidden');$('detailModal').style.display='flex';document.body.style.overflow='hidden';
}
function forceCloseModal(e){if(e){e.preventDefault();e.stopPropagation();}const tx=document.getElementById('txModal'),detail=document.getElementById('detailModal'),theme=document.getElementById('themeModal');if(tx){tx.classList.add('hidden');tx.style.display='none';}if(detail){detail.classList.add('hidden');detail.style.display='none';}if(theme){theme.classList.add('hidden');theme.style.display='none';}document.body.style.overflow='';document.documentElement.style.overflow='';editingId=null;return false}
function closeAnyModal(e){return forceCloseModal(e)}
function syncTxForm(){
 mode=$('txType').value;
 $('modalTitle').textContent=(editingId?'Edit ':'Add ')+(mode==='income'?'Income':mode==='expense'?'Expense':'Transfer');
 $('categoryField').classList.toggle('hidden',mode==='transfer');
 $('toAccountField').classList.toggle('hidden',mode!=='transfer');
}
function openTx(t=null, forcedType=null){
 editingId=t?t.id:null;
 mode=forcedType || (t?t.type:'expense');
 $('date').value=t?.date||today();
 $('description').value=t?.desc||'';
 $('amount').value=t?.amount??'';
  $('account').innerHTML=db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
 $('toAccount').innerHTML=db.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
 $('category').innerHTML=db.categories.map(c=>`<option>${esc(c)}</option>`).join('');
 $('txType').value=mode;
 if(t){$('account').value=t.account;$('toAccount').value=t.to||'';$('category').value=t.category||db.categories[0]}
 syncTxForm();
 $('txModal').classList.remove('hidden');
 $('txModal').style.display='flex';
 document.body.style.overflow='hidden';
 setTimeout(()=>$('description').focus(),80);
}
function saveTx(){
 mode=$('txType').value;
 const amount=Number($('amount').value);
 if(!amount||amount<=0){toast('Please enter a valid amount');return}
 if(!$('date').value){toast('Please select a date');return}
 if(mode==='transfer' && $('account').value===$('toAccount').value){toast('Choose different accounts');return}
 const t={id:editingId||Date.now(),date:$('date').value,desc:$('description').value.trim(),amount,account:$('account').value,type:mode};
 if(mode==='transfer') t.to=$('toAccount').value;
 else if(mode==='expense' || mode==='income') t.category=$('category').value;
 db.tx=db.tx.filter(x=>x.id!==t.id);db.tx.push(t);persist();closeAnyModal();toast('Saved successfully');
}
function deleteTx(id){if(confirm('Delete this transaction?')){db.tx=db.tx.filter(t=>t.id!==id);persist();toast('Deleted')}}

function toggleAccountMenu(e,id){
 if(e){e.preventDefault();e.stopPropagation();}
 const m=document.getElementById('accountMenu_'+id);
 if(!m)return;
 const wasOpen=!m.classList.contains('hidden');
 document.querySelectorAll('.accountMenu,.categoryMenu').forEach(x=>x.classList.add('hidden'));
 if(!wasOpen)m.classList.remove('hidden');
}
function toggleCategoryMenu(e,name){
 if(e){e.preventDefault();e.stopPropagation();}
 const m=document.getElementById('categoryMenu_'+name);
 if(!m)return;
 const wasOpen=!m.classList.contains('hidden');
 document.querySelectorAll('.accountMenu,.categoryMenu').forEach(x=>x.classList.add('hidden'));
 if(!wasOpen)m.classList.remove('hidden');
}
function editCategoryFromList(name){
 const i=db.categories.indexOf(name); if(i<0)return;
 const next=prompt('Category name',name); if(next===null)return;
 const v=next.trim(); if(!v)return;
 if(db.categories.some((x,j)=>j!==i&&x.toLowerCase()===v.toLowerCase())){toast('Category already exists');return;}
 db.tx.forEach(t=>{if(t.type!=='transfer'&&t.category===name)t.category=v});
 db.categories[i]=v; persist(); toast('Category updated');
}
function deleteCategoryFromList(name){
 const i=db.categories.indexOf(name); if(i<0)return;
 if(db.tx.some(t=>t.type!=='transfer'&&t.category===name)){toast('This category is used in a transaction');return;}
 if(!confirm('Delete category '+name+'?'))return;
 db.categories.splice(i,1); persist(); toast('Category deleted');
}

function editOpening(id){
 let a=account(id); if(!a)return;
 let v=prompt('Opening balance for '+a.name,a.opening);
 if(v!==null && v.trim()!=='' && !isNaN(Number(v))){
   a.opening=Number(v); persist(); toast('Opening balance updated');
 }
}
function editAccount(id){
 let a=account(id); if(!a)return;
 let name=prompt('Account name',a.name);
 if(name===null)return;
 name=name.trim(); if(!name)return;
 let opening=prompt('Opening balance (AED)',a.opening);
 if(opening===null)return;
 if(isNaN(Number(opening))) {toast('Invalid opening balance');return;}
 a.name=name; a.opening=Number(opening);
 persist(); toast('Account updated');
}
function deleteAccount(id){
 let a=account(id); if(!a)return;
 if(id==='cash' || id==='bank1'){
   if(!confirm('Delete '+a.name+'? This default account can also be deleted.'))return;
 }
 if(db.tx.some(t=>t.account===id || t.to===id)){
   toast('Cannot delete an account used in transactions');
   return;
 }
 if(!confirm('Delete account '+a.name+'?'))return;
 db.accounts=db.accounts.filter(x=>x.id!==id);
 persist(); toast('Account deleted');
}
function addAccount(){let name=prompt('Account name');if(!name?.trim())return;let o=prompt('Opening balance (AED)','0');db.accounts.push({id:'a'+Date.now(),name:name.trim(),opening:Number(o)||0});persist();toast('Account added')}
function addCategory(){let name=prompt('Category name');if(name?.trim()&&!db.categories.includes(name.trim())){db.categories.push(name.trim());persist();toast('Category added')}}
function customReport(){if($('reportCustomStart'))$('reportCustomStart').value=$('customStart').value||'';if($('reportCustomEnd'))$('reportCustomEnd').value=$('customEnd').value||'';renderReport('custom');$('customRange').classList.remove('hidden');$('reportCustomRange').classList.remove('hidden');}
function applyCustomReport(){let s=$('customStart').value,e=$('customEnd').value;if(!s||!e){toast('Select both dates');return;}if(s>e){toast('Start date must be before end date');return;}customStart=s;customEnd=e;renderReport('custom');$('customRange').classList.add('hidden');$('reportCustomRange').classList.add('hidden');}
function applyReportCustom(){let s=$('reportCustomStart').value,e=$('reportCustomEnd').value;if(!s||!e){toast('Select both dates');return;}if(s>e){toast('Start date must be before end date');return;}customStart=s;customEnd=e;renderReport('custom');$('reportCustomRange').classList.add('hidden');$('customRange').classList.add('hidden');}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cashbook-backup.json';a.click();toast('Backup created')}
function restoreFile(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.accounts||!d.tx)throw 0;db=d;persist();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f)}
function exportCSV(){let rows=[['Date','Type','Description','Category','Account','To Account','Amount','Note']];db.tx.forEach(t=>rows.push([t.date,t.type,t.desc||'',t.category||'',account(t.account)?.name||'',t.to?account(t.to)?.name||'':'',t.amount,t.note||'']));let csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\\n'),b=new Blob([csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cashbook.csv';a.click()}
function getTheme(){return localStorage.getItem('cashbook_theme')||'light'}
function applyTheme(theme){
 theme=theme==='dark'?'dark':'light';
 document.body.classList.toggle('dark',theme==='dark');
 document.documentElement.style.colorScheme=theme;
 localStorage.setItem('cashbook_theme',theme);
 document.querySelectorAll('.themeOption').forEach(b=>{const active=b.dataset.theme===theme;b.classList.toggle('active',active);const c=b.querySelector('.themeCheck');if(c)c.textContent=active?'✓':''});
}
function openThemeModal(){applyTheme(getTheme());$('themeModal').classList.remove('hidden');$('themeModal').style.display='flex';document.body.style.overflow='hidden'}
function closeThemeModal(){if(!$('themeModal'))return;$('themeModal').classList.add('hidden');$('themeModal').style.display='none';document.body.style.overflow=''}
function chooseTheme(theme){applyTheme(theme);closeThemeModal();toast(theme==='dark'?'Dark Mode enabled':'Light Mode enabled')}
function wipe(){if(confirm('Delete ALL CashBook data?')){localStorage.removeItem(KEY);location.reload()}}
$('incomeBtn').onclick=()=>openTx(null,'income');
$('expenseBtn').onclick=()=>openTx(null,'expense');
$('transferBtn').onclick=()=>openTx(null,'transfer');
$('addTransactionBtn').onclick=()=>openTx(null,'expense');
$('txType').onchange=syncTxForm;
$('addAccountBtn').onclick=addAccount;$('addCategoryBtn').onclick=addCategory;
document.querySelectorAll('.reportBtn').forEach(b=>b.onclick=()=>{if(b.dataset.period==='custom'){customReport();return;}$('customRange').classList.add('hidden');$('reportCustomRange').classList.add('hidden');renderReport(b.dataset.period)});$('applyCustomBtn').onclick=applyCustomReport;$('reportApplyCustomBtn').onclick=applyReportCustom;

$('closeDetail').ontouchend=forceCloseModal;

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAnyModal()});
$('saveBtn').onclick=saveTx;$('backupBtn').onclick=backup;$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=restoreFile;$('exportBtn').onclick=exportCSV;$('wipeBtn').onclick=wipe;$('themesBtn').onclick=openThemeModal;$('closeThemeModal').onclick=closeThemeModal;$('closeThemeModal').ontouchend=closeThemeModal;document.querySelectorAll('.themeOption').forEach(b=>b.onclick=()=>chooseTheme(b.dataset.theme));$('themeModal').addEventListener('click',e=>{if(e.target===$('themeModal'))closeThemeModal()});
applyTheme(getTheme());
render();

document.addEventListener('click',function(e){
  const dot=e.target.closest('.accountDots');
  if(dot){
    e.stopPropagation();
    const id=dot.dataset.id;
    document.querySelectorAll('.accountMenu').forEach(m=>{
      if(m.dataset.menu!==id)m.classList.add('hidden');
    });
    const menu=document.querySelector('.accountMenu[data-menu="'+CSS.escape(id)+'"]');
    if(menu)menu.classList.toggle('hidden');
    return;
  }
  const action=e.target.closest('.accountMenu button[data-action]');
  if(action){
    e.stopPropagation();
    const id=action.dataset.id, act=action.dataset.action;
    document.querySelectorAll('.accountMenu').forEach(m=>m.classList.add('hidden'));
    if(act==='opening')editOpening(id);
    else if(act==='edit')editAccount(id);
    else if(act==='delete')deleteAccount(id);
    return;
  }
  document.querySelectorAll('.accountMenu').forEach(m=>m.classList.add('hidden'));
});
</script>
